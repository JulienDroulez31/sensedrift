[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensedrift"
version = "2.0.0"
description = "Audit automatisé de sécurité et d'optimisation des coûts AWS"
requires-python = ">=3.9"
dependencies = ["boto3>=1.34", "reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[all]>=5"]

[project.scripts]
sensedrift = "sensedrift.cli:main"

[tool.setuptools.packages.find]
include = ["sensedrift*"]

[tool.setuptools.package-data]
"sensedrift.report" = ["fonts/*"]
