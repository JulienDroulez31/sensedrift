name: Diagnostic OIDC (temporaire)

# Affiche ce que GitHub envoie à AWS et la réponse exacte d'AWS.
# À supprimer une fois le déploiement fonctionnel.
on:
  push:
    branches: [debug/oidc]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Claims du jeton GitHub (le jeton lui-même n'est pas affiché)
        id: token
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" > "$RUNNER_TEMP/token"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="$PAYLOAD="; done
          echo "$PAYLOAD" | base64 -d | jq '{iss, aud, sub, ref, repository, job_workflow_ref}'

      - name: Réponse d'AWS STS
        run: |
          aws sts assume-role-with-web-identity \
            --role-arn "${{ vars.AWS_DEPLOY_ROLE_ARN }}" \
            --role-session-name diagnostic \
            --web-identity-token "file://$RUNNER_TEMP/token" \
            --region eu-west-1 --query "AssumedRoleUser.Arn" --output text \
            || echo "::warning::Refus AWS ci-dessus. Note : sur la branche debug/oidc, un refus 'Not authorized' est attendu (le rôle n'autorise que main)."
