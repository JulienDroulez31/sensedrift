AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Role IAM assume par GitHub Actions (OIDC, sans cle d'acces) pour publier le
  site dans le bucket S3. Limite a la branche main du depot indique.

Parameters:
  GitHubRepo:
    Type: String
    Default: JulienDroulez31/sensedrift
    Description: Dépôt GitHub autorisé (propriétaire/nom).
  GitHubOwnerId:
    Type: String
    Default: "156816030"
    Description: ID numérique du compte GitHub propriétaire (présent dans le claim sub des nouveaux jetons).
  GitHubRepoId:
    Type: String
    Default: "1447973322"
    Description: ID numérique du dépôt GitHub (présent dans le claim sub des nouveaux jetons).
  Branch:
    Type: String
    Default: main
  BucketName:
    Type: String
    Default: sensedrift-landing
  CloudFrontDistributionId:
    Type: String
    Default: ""
    Description: (Optionnel) ID de la distribution CloudFront à invalider après déploiement.
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Mettre "false" si le fournisseur OIDC token.actions.githubusercontent.com
      existe déjà dans le compte (IAM → Fournisseurs d'identité).

Conditions:
  CreateProvider: !Equals [!Ref CreateOIDCProvider, "true"]
  HasCloudFront: !Not [!Equals [!Ref CloudFrontDistributionId, ""]]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsSensedriftSiteDeploy
      Description: Publication du site depuis GitHub Actions (bucket S3 uniquement).
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOIDCProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub émet désormais un sub incluant les ID immuables du compte et
                # du dépôt (repo:owner@id/name@id:...). L'ancien format reste accepté.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/${Branch}"
                  - !Sub
                    - "repo:${Owner}@${GitHubOwnerId}/${Name}@${GitHubRepoId}:ref:refs/heads/${Branch}"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: DeploySite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BucketName}"
              - Sid: WriteObjects
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${BucketName}/*"
              - !If
                - HasCloudFront
                - Sid: InvalidateCache
                  Effect: Allow
                  Action: cloudfront:CreateInvalidation
                  Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}"
                - !Ref AWS::NoValue

Outputs:
  RoleArn:
    Description: À copier dans la variable GitHub AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
